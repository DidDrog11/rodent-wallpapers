<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rodent of the day</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <img id="map" alt="">
  <canvas id="dots"></canvas>
  <canvas id="flares"></canvas>
  <div id="globe"><div class="frame a"></div><div class="frame b"></div></div>
  <div id="bigglobe"><img class="view a" alt=""><img class="view b" alt=""></div>
</div>
<aside id="panel">
  <section class="ident">
    <img id="silhouette" alt="">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="sci"></h1>
    <div class="common" id="common"></div>
    <p class="sentence" id="sentence"></p>
  </section>

  <section class="traits">
    <h2>Life history</h2>
    <dl id="traits"></dl>
  </section>

  <section class="charts">
    <figure class="season">
      <svg id="season" viewBox="-54 -54 108 108" role="img"></svg>
      <figcaption>Records by month · <span class="now-key"></span>this month</figcaption>
    </figure>
    <figure class="importance">
      <div id="importance"></div>
      <figcaption>What the model leaned on</figcaption>
    </figure>
  </section>

  <section class="legend">
    <div class="ramp-row"><span class="ramp" id="ramp"></span></div>
    <div class="ramp-labels"><span>low</span><span>modelled relative suitability</span><span>high</span></div>
    <div class="key"><span class="dot"></span>GBIF record, thinned</div>
    <div class="key"><span class="ring"></span>Project ArHa sampling site</div>
    <div class="key" id="rangekey"><span class="dash"></span>IUCN expert range</div>
    <div class="replay" id="replay"></div>
  </section>

  <section class="arha" id="arha"></section>
  <section class="source" id="source"></section>
</aside>
<script src="screens.js"></script>
<script src="manifest.js"></script>
<script src="app.js"></script>
</body>
</html>
